name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Интеграционные тесты работают с настоящим Postgres: идемпотентность,
    # ревизии, откат значения и порядок версий во вьюхе держатся на уникальном
    # индексе и ON CONFLICT, а не на коде на Python, - на заглушках эти
    # утверждения проверить нельзя.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fxwatch
          POSTGRES_PASSWORD: fxwatch
          POSTGRES_DB: fxwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxwatch -d fxwatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FXWATCH_TEST_DSN: postgresql+psycopg://fxwatch:fxwatch@localhost:5432/fxwatch_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check src tests

      - name: Тесты
        # Ответы источников подменяются фикстурами и respx, поэтому от
        # доступности ЦБ прогон не зависит; база нужна только тестам,
        # помеченным как integration.
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        # CODE_VERSION попадает в каждый прогон и в отчёт: по нему видно,
        # с какого момента поменялось поведение сервиса.
        run: docker build --build-arg CODE_VERSION=${GITHUB_SHA::7} -t fx-watch:ci .

      - name: Проверка миграций на чистой базе
        run: |
          docker network create fxnet
          docker run -d --name fxdb --network fxnet \
            -e POSTGRES_USER=fxwatch -e POSTGRES_PASSWORD=fxwatch -e POSTGRES_DB=fxwatch \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec fxdb pg_isready -U fxwatch -d fxwatch && break
            sleep 2
          done
          docker run --rm --network fxnet \
            -e FXWATCH_DB_DSN=postgresql+psycopg://fxwatch:fxwatch@fxdb:5432/fxwatch \
            fx-watch:ci migrate

      - name: Схема совпадает с моделями
        # Начальная миграция описывает таблицы явно, поэтому расхождение между
        # models.py и migrations/ возможно - и ловится здесь, а не на проде
        # через полгода.
        run: |
          docker run --rm --network fxnet \
            -e FXWATCH_DB_DSN=postgresql+psycopg://fxwatch:fxwatch@fxdb:5432/fxwatch \
            --entrypoint alembic fx-watch:ci check
